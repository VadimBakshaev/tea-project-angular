<main class="container">
  <div class="my-5 slider">
    @for (item of slideItems; track item) {
    <div>
      <div class="w-100 card border-0">
        <img src="{{item.image}}" class="card-img object-fit-fill" alt="banner {{item.id}}">
        <div
          class="ms-lg-0 ms-xl-5 p-1 p-md-3 p-xl-5 d-flex align-items-start flex-column justify-content-evenly card-img-overlay">
          <h2 class="card-title fw-bold">{{item.title}}</h2>
          @if (item.text.length>0) {
          <p class="card-text d-none d-md-block">{{item.text}}</p>
          }
          <a [routerLink]="'/catalog'" class="btn btn-primary">Заказать</a>
        </div>
      </div>
    </div>
    }
  </div>
</main>
<section class="container mb-5">
  <h2 class="text-center fw-bold mb-5">Ответы на часто задаваемые вопросы</h2>
  <div class="row justify-content-center">
    <div ngbAccordion [closeOthers]="true" class="col-lg-12 col-xl-8">
      @for (item of accordionItems; track item) {
      <div ngbAccordionItem class="border-0" [collapsed]="item.id !== 1">
        <button ngbAccordionHeader ngbAccordionButton
          class="shadow-none border-0 rounded-3 p-4 pe-5 bg-primary text-white">
          {{item.header}}
        </button>
        <div ngbAccordionCollapse>
          <p ngbAccordionBody>
            {{item.body}}
          </p>
        </div>
      </div>
      }
    </div>
  </div>
</section>
<ng-template>  
<modal-content>
<div class="modal-dialog modal-dialog-centered">
  ...
</div>
</modal-content>
</ng-template>
